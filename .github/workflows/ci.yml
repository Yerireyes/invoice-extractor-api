name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: pytest + cobertura (mínimo 80 %)
        run: uv run pytest --cov=app --cov-report=term-missing

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Construir imagen (sin push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: invoice-extractor-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
