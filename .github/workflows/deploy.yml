name: Deploy

# Producción solo al publicar un release (no en cada push a `main`).
# 1. Construye la imagen Docker y la publica en GitHub Container Registry (GHCR).
# 2. Pide a Render que despliegue esa imagen exacta (por digest) mediante su deploy hook.
# 3. Espera a que la nueva versión responda (smoke test).
#
# Requiere (ver README → Versiones y despliegue):
# - Secreto `RENDER_DEPLOY_HOOK`: URL del deploy hook del servicio en Render.
# - Variable `RENDER_URL`: URL pública del servicio (https://<nombre>.onrender.com).
# Lanzado a mano sin esa configuración, solo publica la imagen (primer paso para crear el servicio).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write # publicar la imagen en GHCR con el GITHUB_TOKEN

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  SMOKE_TIMEOUT_S: "900" # Render descarga la imagen y arranca el servicio (y puede estar dormido)

jobs:
  deploy:
    name: Render
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}
    steps:
      - uses: actions/checkout@v7

      - name: Versión e imagen
        id: meta
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          [[ -n "$version" ]] || { echo "::error::No se pudo leer la versión de pyproject.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # GHCR exige el nombre en minúsculas
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir y publicar la imagen
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Comprobar configuración de Render
        id: render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          URL: ${{ vars.RENDER_URL }}
          EVENT: ${{ github.event_name }}
        run: |
          if [[ -n "$HOOK" && -n "$URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" == "release" ]]; then
            echo "::error::Faltan el secreto RENDER_DEPLOY_HOOK o la variable RENDER_URL (ver README → Versiones y despliegue)"
            exit 1
          else
            echo "::warning::Imagen publicada, pero Render no está configurado: no se despliega."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar en Render
        if: steps.render.outputs.configured == 'true'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}
        run: |
          # Se despliega por digest: exactamente la imagen recién construida.
          img_url=$(jq -rn --arg v "$IMAGE" '$v | @uri')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "${HOOK}&imgURL=${img_url}")
          if [[ "$status" != 200 && "$status" != 202 ]]; then
            echo "::error::Render rechazó el deploy (HTTP $status)"
            exit 1
          fi
          echo "Deploy solicitado (HTTP $status): $IMAGE"

      - name: Smoke test (espera a la nueva versión)
        if: steps.render.outputs.configured == 'true'
        env:
          URL: ${{ vars.RENDER_URL }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # Mientras despliega, Render sigue sirviendo la versión anterior: se espera a que /meta
          # anuncie la versión nueva y /health responda 200.
          deadline=$((SECONDS + SMOKE_TIMEOUT_S))
          while (( SECONDS < deadline )); do
            deployed=$(curl -fsS --max-time 30 "$URL/api/v1/meta" | jq -r '.version' 2>/dev/null || true)
            if [[ "$deployed" == "$VERSION" ]] && curl -fsS --max-time 30 "$URL/api/v1/health"; then
              echo
              echo "OK: $URL responde con la versión $VERSION"
              exit 0
            fi
            echo "Esperando a $VERSION (ahora: ${deployed:-sin respuesta})..."
            sleep 20
          done
          echo "::error::$URL no respondió con la versión $VERSION en ${SMOKE_TIMEOUT_S} s"
          exit 1
